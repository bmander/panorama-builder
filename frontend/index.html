<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panorama</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="map-wrap">
    <div id="map"></div>
  </div>
  <div id="top-right" class="top-right-fixed">
    <a id="view-on-map" class="btn" href="/">Map →</a>
    <button id="menu-btn" class="btn" aria-expanded="false" aria-haspopup="menu" aria-controls="menu-dropdown">☰</button>
  </div>
  <div id="menu-dropdown" role="menu" hidden>
    <button id="admin-btn" class="menu-item" role="menuitem" hidden>Admin</button>
    <button id="settings-btn" class="menu-item" role="menuitem" aria-expanded="false">Display</button>
    <button id="sun-dial-btn" class="menu-item" role="menuitem">Sun dial</button>
    <button id="download" class="menu-item" role="menuitem">Download PNG</button>
  </div>
  <div id="index-top-right" class="top-right-fixed" hidden>
    <button id="index-solve-btn" class="btn">Solve</button>
  </div>
  <div id="session-host" class="session-host"></div>
  <div id="time-filter" hidden>
    <div class="time-filter-row">
      <label for="time-filter-date">Show CPs extant on</label>
      <input type="date" id="time-filter-date">
    </div>
    <input type="range" id="time-filter-slider" step="1">
    <div class="time-filter-year" id="time-filter-year-readout"></div>
  </div>
  <div id="cp-constraint-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span id="cp-constraint-title">Constraint</span>
        <button type="button" id="cp-constraint-close" class="btn">✕</button>
      </div>
      <div id="cp-constraint-pair" class="modal-field"></div>
      <div class="modal-field">
        <label><input type="radio" name="cp-constraint-type" value="plumb"> Plumb (same lat/lng)</label>
        <label><input type="radio" name="cp-constraint-type" value="level"> Level (same elevation)</label>
      </div>
      <div class="modal-actions">
        <button type="button" id="cp-constraint-delete" class="btn danger" hidden>Delete</button>
        <button type="button" id="cp-constraint-cancel" class="btn">Cancel</button>
        <button type="button" id="cp-constraint-save" class="btn">Save</button>
      </div>
    </div>
  </div>
  <div id="cp-surface-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>Surface</span>
        <button type="button" id="cp-surface-close" class="btn">✕</button>
      </div>
      <div id="cp-surface-info" class="modal-field"></div>
      <div class="modal-actions">
        <button type="button" id="cp-surface-cancel" class="btn">Cancel</button>
        <button type="button" id="cp-surface-delete" class="btn danger">Delete surface</button>
      </div>
    </div>
  </div>
  <div id="sundial-panel" hidden>
    <div class="sundial-header">
      <span>Sun dial</span>
      <button type="button" id="sundial-close" class="btn">✕</button>
    </div>
    <div class="sundial-row">
      <div class="sundial-row-label">Gnomon</div>
      <div id="sundial-gnomon-readout" class="sundial-row-value">not set</div>
      <button type="button" id="sundial-pick-gnomon" class="btn">Pick CP</button>
      <button type="button" id="sundial-clear-gnomon" class="btn" hidden>✕</button>
    </div>
    <div class="sundial-row">
      <div class="sundial-row-label">Shadow</div>
      <div id="sundial-shadow-readout" class="sundial-row-value">not set</div>
      <button type="button" id="sundial-pick-shadow" class="btn">Pick on surface</button>
      <button type="button" id="sundial-clear-shadow" class="btn" hidden>✕</button>
    </div>
    <div id="sundial-result"></div>
  </div>
  <div id="constraint-multiselect-hud" hidden>
    <span><span id="constraint-multiselect-count">0</span> constraint(s) selected</span>
    <button type="button" id="constraint-add-surface-btn" class="btn" disabled>Add surface</button>
    <button type="button" id="constraint-multiselect-clear" class="btn">Clear</button>
  </div>
  <div id="admin-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>Station admin</span>
        <button type="button" id="admin-close" class="btn">✕</button>
      </div>
      <button type="button" id="admin-delete" class="btn danger">Delete station</button>
    </div>
  </div>
  <div id="start-station-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>New station</span>
        <button type="button" id="start-station-close" class="btn">✕</button>
      </div>
      <label class="modal-field">Title
        <input type="text" id="start-station-title" required maxlength="120">
      </label>
      <label class="modal-field">Captured at
        <input type="datetime-local" id="start-station-captured-at" required step="60">
      </label>
      <div class="modal-field">
        <span>Photos</span>
        <div id="start-station-drop" class="drop-zone">
          <span>Drop images here, or click to choose</span>
          <input type="file" id="start-station-files" accept="image/*" multiple hidden>
        </div>
        <div id="start-station-photos-preview"></div>
      </div>
      <div class="modal-actions">
        <button type="button" id="start-station-cancel" class="btn">Cancel</button>
        <button type="button" id="start-station-submit" class="btn">Create</button>
      </div>
    </div>
  </div>
  <div id="observe-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span id="observe-title">Add observation</span>
        <button type="button" id="observe-close" class="btn">✕</button>
      </div>
      <div class="modal-field">
        <input type="text" id="observe-new-desc" maxlength="200" required>
      </div>
      <div id="observe-cp-list" class="cp-list"></div>
      <div class="modal-actions">
        <button type="button" id="observe-cancel" class="btn">Cancel</button>
        <button type="button" id="observe-create" class="btn">Create</button>
      </div>
    </div>
  </div>
  <div id="params-panel" hidden>
    <div class="params-section">
      <div class="params-section-header">Station</div>
      <div class="settings-row station-pos">
        <label class="settings-inline">lat <input type="number" id="station-lat" step="0.000001"></label>
        <label class="settings-inline">lng <input type="number" id="station-lng" step="0.000001"></label>
        <label class="settings-check" title="When checked, the solver leaves this station's lat and lng untouched. Joint mode needs ≥2 stations locked to fix the gauge."><input type="checkbox" id="station-lock-pos"> lock location</label>
      </div>
      <div class="settings-row station-pos">
        <label class="settings-inline" title="Camera elevation in metres above mean sea level.">alt <input type="number" id="station-alt" step="0.1"> m MSL</label>
        <label class="settings-check" title="When checked, the solver treats this station's elevation (metres above mean sea level) as a fixed input."><input type="checkbox" id="station-lock-alt"> lock elevation</label>
      </div>
    </div>
    <div id="params-photo-section" class="params-section" hidden>
      <div class="params-section-header">Selected photo</div>
      <label class="settings-inline">Opacity
        <input type="range" id="photo-hud-opacity" min="0" max="100" value="100" step="1">
      </label>
      <div class="photo-hud-row">
        <span>Azimuth (°)</span>
        <input type="number" id="photo-hud-az" step="0.1">
        <label class="lock-check"><input type="checkbox" id="photo-hud-az-lock"> lock</label>
      </div>
      <div class="photo-hud-row">
        <span>Tilt (°)</span>
        <input type="number" id="photo-hud-tilt" step="0.1">
        <label class="lock-check"><input type="checkbox" id="photo-hud-tilt-lock"> lock</label>
      </div>
      <div class="photo-hud-row">
        <span>Roll (°)</span>
        <input type="number" id="photo-hud-roll" step="0.1">
        <label class="lock-check"><input type="checkbox" id="photo-hud-roll-lock"> lock</label>
      </div>
      <div class="photo-hud-row">
        <span>FOV (°)</span>
        <input type="number" id="photo-hud-fov" step="0.1" min="2" max="162">
        <label class="lock-check"><input type="checkbox" id="photo-hud-fov-lock"> lock</label>
      </div>
      <div class="photo-hud-row">
        <span>Aspect</span>
        <input type="text" id="photo-hud-aspect" readonly>
      </div>
      <div class="photo-hud-row">
        <span>k1 (radial)</span>
        <input type="number" id="photo-hud-k1" step="0.001">
        <label class="lock-check"><input type="checkbox" id="photo-hud-k1-lock"> lock</label>
      </div>
      <div class="photo-hud-row">
        <span>k2 (radial)</span>
        <input type="number" id="photo-hud-k2" step="0.001">
        <label class="lock-check"><input type="checkbox" id="photo-hud-k2-lock"> lock</label>
      </div>
    </div>
  </div>
  <div id="solve-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span id="solve-title">Solve</span>
        <button type="button" id="solve-close" class="btn">✕</button>
      </div>
      <label class="modal-field" title="Per-residual RMS angular error threshold, in radians. When the average per-observation residual drops below this, the solver stops as converged. Default 1e-4 ≈ 20 arcsec.">Residual tolerance (rad)
        <input type="text" id="solve-residual-tol" value="1e-4">
      </label>
      <label class="modal-field" title="Per-iteration fractional reduction in residual RMS below which the run is considered converged. Push smaller (e.g. 1e-6) for tighter convergence at the cost of more iterations. Default 1e-4 = stop when each iteration improves by less than 0.01%.">Convergence tolerance (relative)
        <input type="text" id="solve-rel-improve-tol" value="1e-4">
      </label>
      <label class="modal-field" title="Tikhonov regularization weight on each photo's dist_k1 / dist_k2 lens-distortion slots. Pulls weakly-observed coefficients toward zero so they don't run away on narrow-FOV photos. Higher = stronger pull. 0 falls back to the default 0.05; enter a negative number to disable.">k1/k2 regularization (λ)
        <input type="text" id="solve-k-reg-lambda" value="0.05">
      </label>
      <label class="settings-check"><input type="checkbox" id="solve-dry-run"> Dry run (don't write to DB)</label>
      <div id="solve-progress" hidden>
        <div id="solve-status"></div>
        <canvas id="solve-loss-chart" width="480" height="160"></canvas>
      </div>
      <div class="modal-actions">
        <button type="button" id="solve-close-btn" class="btn">Close</button>
        <button type="button" id="solve-cancel-btn" class="btn" hidden>Cancel</button>
        <button type="button" id="solve-stop-btn" class="btn" hidden>Stop here</button>
        <button type="button" id="solve-run" class="btn">Run</button>
      </div>
    </div>
  </div>
  <div id="context-menu" hidden></div>
  <div id="settings-panel" hidden>
    <div class="settings-row">
      <button type="button" id="solve-station-btn" class="btn">Solve station…</button>
    </div>
    <div class="settings-row station-pos">
      <label class="settings-inline" title="When the photographer's camera was set up at this site. Used by the index-map time filter to decide which CPs were extant at the time of capture.">captured at <input type="datetime-local" id="station-captured-at" step="60"></label>
    </div>
    <label class="settings-check"><input type="checkbox" id="terrain-toggle" checked> Terrain</label>
    <label class="settings-inline">Sun <input type="datetime-local" id="sun-datetime" step="60"></label>
    <div class="settings-row">
      <label for="haze-slider">Atmospheric haze</label>
      <input type="range" id="haze-slider" min="0" max="100" value="17" step="1">
    </div>
    <details class="settings-group">
      <summary>Sky model</summary>
      <div class="settings-row" title="Overall brightness of the physical sky model.">
        <label for="sky-sun-intensity">Sun intensity</label>
        <input type="range" id="sky-sun-intensity" min="0" max="60" value="22" step="0.5">
      </div>
      <div class="settings-row" title="Mie scattering strength — turns up the soft glow around the sun and the overall haze of the sky.">
        <label for="sky-mie-coef">Sky Mie strength</label>
        <input type="range" id="sky-mie-coef" min="0" max="4" value="1" step="0.05">
      </div>
      <div class="settings-row" title="Mie anisotropy (Henyey-Greenstein g) — higher values concentrate scattering into a tighter forward halo near the sun.">
        <label for="sky-mie-g">Sun halo focus</label>
        <input type="range" id="sky-mie-g" min="0" max="0.95" value="0.76" step="0.01">
      </div>
    </details>
    <div class="settings-row">
      <label for="surface-opacity-slider">Surface opacity</label>
      <input type="range" id="surface-opacity-slider" min="0" max="100" value="35" step="1">
    </div>
    <label class="settings-check"><input type="checkbox" id="curvature-toggle" checked> Earth curvature</label>
    <label class="settings-check"><input type="checkbox" id="refraction-toggle" checked> Atmospheric refraction</label>
    <label class="settings-check" title="Show every control point with a known location, not just those observed by this station. Useful for adding observations for cross-station landmarks."><input type="checkbox" id="show-all-cps"> Show all control points</label>
  </div>
  <div id="hud"></div>
  <div id="save-error" hidden>
    <span id="save-error-msg"></span>
    <button type="button" id="save-error-retry" class="btn">Retry</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
