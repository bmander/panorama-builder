<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panorama</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="map-wrap">
    <div id="map"></div>
  </div>
  <div id="top-right">
    <button id="admin-btn" class="btn" hidden>Admin</button>
    <button id="settings-btn" class="btn" aria-expanded="false">⚙ Settings</button>
    <a id="view-on-map" class="btn" href="/">📍 Map</a>
    <button id="download" class="btn">download PNG</button>
  </div>
  <div id="admin-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>Station admin</span>
        <button type="button" id="admin-close" class="btn">✕</button>
      </div>
      <button type="button" id="admin-delete" class="btn danger">Delete station</button>
    </div>
  </div>
  <div id="start-station-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>New station</span>
        <button type="button" id="start-station-close" class="btn">✕</button>
      </div>
      <label class="modal-field">Title
        <input type="text" id="start-station-title" required maxlength="120">
      </label>
      <label class="modal-field">Date estimate
        <input type="datetime-local" id="start-station-date" step="60">
      </label>
      <div class="modal-field">
        <span>Photos</span>
        <div id="start-station-drop" class="drop-zone">
          <span>Drop images here, or click to choose</span>
          <input type="file" id="start-station-files" accept="image/*" multiple hidden>
        </div>
        <div id="start-station-photos-preview"></div>
      </div>
      <div class="modal-actions">
        <button type="button" id="start-station-cancel" class="btn">Cancel</button>
        <button type="button" id="start-station-submit" class="btn">Create</button>
      </div>
    </div>
  </div>
  <div id="observe-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span id="observe-title">Add observation</span>
        <button type="button" id="observe-close" class="btn">✕</button>
      </div>
      <div id="observe-cp-list" class="cp-list"></div>
      <div class="modal-field">
        <span id="observe-desc-label">Or create a new control point</span>
        <input type="text" id="observe-new-desc" placeholder="name" maxlength="200" required>
      </div>
      <div class="modal-field" id="observe-elev-row" hidden>
        <span>Elevation above grade (m)</span>
        <input type="number" id="observe-new-elev" step="0.1" value="0">
      </div>
      <div class="modal-actions">
        <button type="button" id="observe-cancel" class="btn">Cancel</button>
        <button type="button" id="observe-create" class="btn">Create</button>
      </div>
    </div>
  </div>
  <div id="photo-params-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>Photo parameters</span>
        <button type="button" id="photo-params-close" class="btn">✕</button>
      </div>
      <div class="modal-field photo-params-row">
        <span>Azimuth (°)</span>
        <input type="number" id="photo-params-az" step="0.1">
        <label class="lock-check"><input type="checkbox" id="photo-params-az-lock"> lock</label>
      </div>
      <div class="modal-field photo-params-row">
        <span>Tilt (°)</span>
        <input type="number" id="photo-params-tilt" step="0.1">
        <label class="lock-check"><input type="checkbox" id="photo-params-tilt-lock"> lock</label>
      </div>
      <div class="modal-field photo-params-row">
        <span>Roll (°)</span>
        <input type="number" id="photo-params-roll" step="0.1">
        <label class="lock-check"><input type="checkbox" id="photo-params-roll-lock"> lock</label>
      </div>
      <div class="modal-field photo-params-row">
        <span>FOV (°)</span>
        <input type="number" id="photo-params-fov" step="0.1" min="2" max="162">
        <label class="lock-check"><input type="checkbox" id="photo-params-fov-lock"> lock</label>
      </div>
      <div class="modal-field photo-params-row">
        <span>Aspect</span>
        <input type="text" id="photo-params-aspect" readonly>
      </div>
      <div class="modal-actions">
        <button type="button" id="photo-params-cancel" class="btn">Cancel</button>
        <button type="button" id="photo-params-save" class="btn">Save</button>
      </div>
    </div>
  </div>
  <div id="context-menu" hidden></div>
  <div id="settings-panel" hidden>
    <div class="settings-row">
      <button type="button" id="solve-station-btn" class="btn">Solve station</button>
      <button type="button" id="solve-joint-btn" class="btn">Solve all (joint)</button>
    </div>
    <label class="settings-check"><input type="checkbox" id="lock-station-pos"> Lock this station's position (gauge)</label>
    <label class="settings-inline">Terrain
      <select id="terrain-mode">
        <option value="off">off</option>
        <option value="wireframe">wireframe</option>
        <option value="shaded">shaded</option>
      </select>
    </label>
    <label class="settings-inline">Sun <input type="datetime-local" id="sun-datetime" step="60"></label>
    <label class="settings-inline" id="overlay-opacity-row">Photo opacity
      <input type="range" id="overlay-opacity" min="0" max="100" value="100" step="1">
    </label>
    <div class="settings-row">
      <label for="haze-slider">Atmospheric haze</label>
      <input type="range" id="haze-slider" min="0" max="100" value="17" step="1">
    </div>
    <label class="settings-check"><input type="checkbox" id="curvature-toggle" checked> Earth curvature</label>
    <label class="settings-check"><input type="checkbox" id="refraction-toggle" checked> Atmospheric refraction</label>
  </div>
  <div id="hud"></div>
  <div id="save-error" hidden>
    <span id="save-error-msg"></span>
    <button type="button" id="save-error-retry" class="btn">Retry</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      }
    }
  </script>
  <script type="module" src="/build/main.js"></script>
</body>
</html>
