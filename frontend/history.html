<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commit history · Viewfinder</title>
  <meta name="description" content="Commit history in Viewfinder.">
  <meta name="theme-color" content="#000000">
  <meta property="og:site_name" content="Viewfinder">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Commit history · Viewfinder">
  <meta property="og:description" content="Commit history in Viewfinder.">
  <meta property="og:image" content="/assets/apple-touch-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Commit history · Viewfinder">
  <meta name="twitter:description" content="Commit history in Viewfinder.">
  <meta name="twitter:image" content="/assets/apple-touch-icon.png">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/cp.css">
</head>
<body>
  <a class="site-badge" href="/">Viewfinder</a>
  <main>
    <a class="back" href="/">← back to map</a>
    <h1>Commit history</h1>
    <ul id="list" class="commits-list"></ul>
    <nav class="commits-pager">
      <a id="pager-newer" class="btn" href="/history.html" hidden>← Newest</a>
      <a id="pager-older" class="btn" href="#" hidden>Older →</a>
    </nav>
  </main>
  <div id="revert-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span id="revert-modal-title">Revert to before here</span>
        <button type="button" id="revert-close" class="btn">✕</button>
      </div>
      <div class="modal-field">
        <label for="revert-signoff">Sign-off</label>
        <input type="text" id="revert-signoff" required>
      </div>
      <div class="modal-field">
        <label for="revert-description">Description (optional)</label>
        <textarea id="revert-description" rows="3"></textarea>
      </div>
      <div id="revert-error" class="modal-error" hidden></div>
      <div class="modal-actions">
        <button type="button" id="revert-cancel" class="btn">Cancel</button>
        <button type="button" id="revert-confirm" class="btn" disabled>Revert</button>
      </div>
    </div>
  </div>
  <div id="changes-modal" class="modal" hidden>
    <div class="modal-panel changes-panel">
      <div class="modal-header">
        <span id="changes-modal-title">Changes</span>
        <button type="button" id="changes-close" class="btn">✕</button>
      </div>
      <pre id="changes-dump" class="changes-dump"></pre>
    </div>
  </div>
  <script type="module" src="/src/history-page.ts"></script>
</body>
</html>
