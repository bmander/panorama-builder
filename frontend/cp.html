<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control point</title>
  <link rel="stylesheet" href="/cp.css">
</head>
<body>
  <main>
    <div class="nav">
      <a class="back" href="/">← back to map</a>
      <a id="map-link" class="back" hidden>View on map →</a>
    </div>
    <h1 id="name"></h1>
    <dl>
      <dt>id</dt><dd id="id"></dd>
      <dt>location</dt>
      <dd>
        <span id="lat" class="value empty"></span>
        <span class="sep">,</span>
        <span id="lng" class="value empty"></span>
        <label class="lock" title="When checked, the solver leaves lat and lng untouched.">
          <input type="checkbox" id="lock-est-location"> lock location
        </label>
      </dd>
      <dt>elevation</dt>
      <dd>
        <span id="alt" class="value"></span>
        <label class="lock" title="When checked, the solver leaves the value untouched.">
          <input type="checkbox" id="lock-est-alt"> lock
        </label>
      </dd>
      <dt id="started_at_label" class="lifespan-label">started</dt><dd id="started_at" class="empty"></dd>
      <dt id="ended_at_label" class="lifespan-label">ended</dt><dd id="ended_at" class="empty"></dd>
    </dl>
    <h2>Notes</h2>
    <div id="notes" class="notes empty"></div>
    <h2>Observations</h2>
    <ul id="observations" class="observations"></ul>
    <div class="actions">
      <button id="solve" type="button" disabled>Refine location</button>
      <button id="delete" class="danger" type="button" disabled>Delete control point</button>
    </div>
  </main>
  <script type="module" src="/build/cp-page.js"></script>
</body>
</html>
