<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control point</title>
  <link rel="stylesheet" href="/cp.css">
</head>
<body>
  <main>
    <div class="nav">
      <a class="back" href="/">← back to map</a>
      <a id="map-link" class="back" hidden>View on map →</a>
    </div>
    <h1 id="name"></h1>
    <dl>
      <dt>id</dt><dd id="id"></dd>
      <dt>lat</dt><dd id="lat" class="empty"></dd>
      <dt>lng</dt><dd id="lng" class="empty"></dd>
      <dt>elevation</dt><dd id="alt"></dd>
      <dt>locks</dt><dd>
        <label><input type="checkbox" id="lock-est-lat"> lat</label>
        <label><input type="checkbox" id="lock-est-lng"> lng</label>
        <label><input type="checkbox" id="lock-est-alt"> alt</label>
        <span class="hint">When checked, the solver leaves the value untouched.</span>
      </dd>
      <dt>started</dt><dd id="started_at" class="empty"></dd>
      <dt>ended</dt><dd id="ended_at" class="empty"></dd>
    </dl>
    <h2>Notes</h2>
    <div id="notes" class="notes empty"></div>
    <h2>Observations</h2>
    <ul id="observations" class="observations"></ul>
    <div class="actions">
      <button id="solve" type="button" disabled>Refine location</button>
      <button id="delete" class="danger" type="button" disabled>Delete control point</button>
    </div>
  </main>
  <script type="module" src="/build/cp-page.js"></script>
</body>
</html>
