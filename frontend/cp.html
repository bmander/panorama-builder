<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control point · Viewfinder</title>
  <meta name="description" content="Control point details in Viewfinder.">
  <meta name="theme-color" content="#000000">
  <meta property="og:site_name" content="Viewfinder">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Control point · Viewfinder">
  <meta property="og:description" content="Control point details in Viewfinder.">
  <meta property="og:image" content="/assets/apple-touch-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Control point · Viewfinder">
  <meta name="twitter:description" content="Control point details in Viewfinder.">
  <meta name="twitter:image" content="/assets/apple-touch-icon.png">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/cp.css">
</head>
<body>
  <a class="site-badge" href="/">Viewfinder</a>
  <div id="session-host" class="session-host"></div>
  <main>
    <h1 id="name"></h1>
    <dl>
      <dt>id</dt><dd id="id"></dd>
      <dt>location</dt>
      <dd>
        <span id="lat" class="value empty"></span>
        <span class="sep">,</span>
        <span id="lng" class="value empty"></span>
        <label class="lock" title="When checked, the solver leaves lat and lng untouched.">
          <input type="checkbox" id="lock-est-location"> lock location
        </label>
        <a id="map-link" class="back" hidden>View on map →</a>
      </dd>
      <dt title="Metres above mean sea level.">elevation (m MSL)</dt>
      <dd>
        <span id="alt" class="value"></span>
        <label class="lock" title="When checked, the solver leaves the elevation (metres above mean sea level) untouched.">
          <input type="checkbox" id="lock-est-alt"> lock
        </label>
      </dd>
      <dt id="started_at_label" class="lifespan-label">started</dt><dd id="started_at" class="empty"></dd>
      <dt id="ended_at_label" class="lifespan-label">ended</dt><dd id="ended_at" class="empty"></dd>
    </dl>
    <div id="cp-inconsistency-host" hidden></div>
    <h2>Notes</h2>
    <div id="notes" class="notes empty"></div>
    <h2>Observations</h2>
    <ul id="observations" class="observations"></ul>
    <h2>Candidate photos</h2>
    <ul id="visible-photos" class="visible-photos-grid"></ul>
    <div class="actions">
      <button id="delete" class="danger" type="button" disabled>Delete control point</button>
    </div>
  </main>
  <script type="module" src="/src/cp-page.ts"></script>
</body>
</html>
