<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control point · Viewfinder</title>
  <meta name="description" content="Control point details in Viewfinder.">
  <meta name="theme-color" content="#000000">
  <meta property="og:site_name" content="Viewfinder">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Control point · Viewfinder">
  <meta property="og:description" content="Control point details in Viewfinder.">
  <meta property="og:image" content="/assets/apple-touch-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Control point · Viewfinder">
  <meta name="twitter:description" content="Control point details in Viewfinder.">
  <meta name="twitter:image" content="/assets/apple-touch-icon.png">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/cp.css">
</head>
<body>
  <a class="site-badge" href="/">Viewfinder</a>
  <div id="session-controls">
    <div id="solver-host" class="session-host"></div>
    <div id="session-host" class="session-host"></div>
  </div>
  <main>
    <h1 id="name"></h1>
    <dl>
      <dt>id</dt><dd id="id"></dd>
      <dt>location</dt>
      <dd>
        <span id="lat" class="value empty"></span>
        <span class="sep">,</span>
        <span id="lng" class="value empty"></span>
        <label class="lock" title="When checked, the solver leaves lat and lng untouched.">
          <input type="checkbox" id="lock-est-location"> lock location
        </label>
        <a id="map-link" class="back" hidden>View on map →</a>
      </dd>
      <dt title="Feet above mean sea level.">elevation (ft MSL)</dt>
      <dd>
        <span id="alt" class="value"></span>
        <label class="lock" title="When checked, the solver leaves the elevation (feet above mean sea level) untouched.">
          <input type="checkbox" id="lock-est-alt"> lock
        </label>
      </dd>
      <dt id="started_at_label" class="lifespan-label">started</dt><dd id="started_at" class="empty"></dd>
      <dt id="ended_at_label" class="lifespan-label">ended</dt><dd id="ended_at" class="empty"></dd>
    </dl>
    <div id="cp-inconsistency-host" hidden></div>
    <h2>Notes</h2>
    <div id="notes" class="notes empty"></div>
    <h2>Observations</h2>
    <ul id="observations" class="observations"></ul>
    <h2>Candidate photos</h2>
    <ul id="visible-photos" class="visible-photos-grid"></ul>
    <div class="actions">
      <button id="delete" class="danger" type="button" disabled>Delete control point</button>
    </div>
  </main>
  <div id="solve-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span id="solve-title">Solve</span>
        <button type="button" id="solve-close" class="btn">✕</button>
      </div>
      <div class="settings-row solve-slider-row">
        <label for="solve-function-tol" title="Stops the solver when per-iteration relative cost reduction falls below this. Default 1e-4 = stop when each iteration reduces total cost by less than 0.01%. Smaller = tighter convergence at the cost of more iterations.">Cost-reduction tolerance</label>
        <input type="range" id="solve-function-tol" min="-7" max="-2" step="0.1" value="-4">
        <output for="solve-function-tol" id="solve-function-tol-readout" class="solve-slider-readout">1.0e-4</output>
      </div>
      <div class="settings-row solve-slider-row">
        <label for="solve-step-tol" title="Stops the solver when the relative state-vector step falls below this — i.e. when per-iteration parameter updates become negligibly small. Default 1e-7. Smaller = tighter convergence at the cost of more iterations.">Step-size tolerance</label>
        <input type="range" id="solve-step-tol" min="-12" max="-4" step="0.1" value="-7">
        <output for="solve-step-tol" id="solve-step-tol-readout" class="solve-slider-readout">1.0e-7</output>
      </div>
      <div class="settings-row solve-slider-row">
        <label for="solve-k-reg-lambda" title="Tikhonov regularization weight on each photo's dist_k1 / dist_k2 lens-distortion slots. Pulls weakly-observed coefficients toward zero so they don't run away on narrow-FOV photos. Higher = stronger pull. Default 0.05.">k1/k2 regularization (λ)</label>
        <input type="range" id="solve-k-reg-lambda" min="-4" max="0" step="0.1" value="-1.3">
        <output for="solve-k-reg-lambda" id="solve-k-reg-lambda-readout" class="solve-slider-readout">5.0e-2</output>
      </div>
      <div class="settings-row solve-slider-row">
        <label for="solve-position-reg-lambda" title="Tikhonov prior pulling each unlocked station back toward its user-supplied lat/lng (and alt). Each station axis adds a residual √λ·offset_m, so larger λ makes the solver demand stronger observational evidence before moving a station. λ = (σ_residual_rad / σ_position_m)²; try 1e-6 for a soft prior, 1e-4 for a strong one. Leftmost = off.">Position prior (λ)</label>
        <input type="range" id="solve-position-reg-lambda" min="-9" max="-2" step="0.1" value="-9">
        <output for="solve-position-reg-lambda" id="solve-position-reg-lambda-readout" class="solve-slider-readout">off</output>
      </div>
      <label class="settings-check"><input type="checkbox" id="solve-dry-run"> Dry run (don't write to DB)</label>
      <div id="solve-progress" hidden>
        <div id="solve-status"></div>
        <canvas id="solve-loss-chart" width="480" height="160"></canvas>
      </div>
      <div class="modal-actions">
        <button type="button" id="solve-close-btn" class="btn">Close</button>
        <button type="button" id="solve-cancel-btn" class="btn" hidden>Cancel</button>
        <button type="button" id="solve-stop-btn" class="btn" hidden>Stop here</button>
        <button type="button" id="solve-run" class="btn">Run</button>
      </div>
    </div>
  </div>
  <div id="session-save-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>Save session</span>
        <button type="button" id="session-save-close" class="btn">✕</button>
      </div>
      <div class="modal-field">
        <label for="session-save-signoff">Sign-off</label>
        <input type="text" id="session-save-signoff" required>
      </div>
      <div class="modal-field">
        <label for="session-save-description">Description (optional)</label>
        <textarea id="session-save-description" rows="3"></textarea>
      </div>
      <div id="session-save-error" class="modal-error" hidden></div>
      <div id="session-save-rank-warning" class="modal-field" hidden></div>
      <label class="settings-check" title="Bypass the σ check on entities whose free axes have poor uncertainty from the last solve. Use only when you've reviewed the flagged list above."><input type="checkbox" id="session-save-allow-underdetermined"> Save anyway (override σ check)</label>
      <div class="modal-actions">
        <button type="button" id="session-save-cancel" class="btn">Cancel</button>
        <button type="button" id="session-save-confirm" class="btn" disabled>Save</button>
      </div>
    </div>
  </div>
  <div id="session-conflict-modal" class="modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span>Save blocked by conflicts</span>
        <button type="button" id="session-conflict-close" class="btn">✕</button>
      </div>
      <div id="session-conflict-list" class="modal-field"></div>
      <div class="modal-actions">
        <button type="button" id="session-conflict-abandon" class="btn danger">Abandon session</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/cp-page.ts"></script>
</body>
</html>
