openapi: 3.0.3
info:
  title: Viewfinder API
  description: |
    JSON API for compositing flat photos into a 360° panorama. Stores
    stations (camera setups), photos (with embedded pose), image
    measurements (reticle anchors on photos), and control points
    (cross-station landmarks with a user-seeded location estimate).

    Image measurements link to a control point; the CP is the latent
    real-world feature each observation describes.

    All resources use server-assigned 13-character base32 IDs.
    Authentication is out of scope — anyone with the URL has read+write
    access. Field-level validation lives in handler code; this spec
    documents shapes only.
  version: 1.0.0

servers:
  - url: /api

tags:
  - name: meta
  - name: stations
  - name: photos
  - name: image-measurements
  - name: control-points
  - name: cp-observations
  - name: cp-constraints
  - name: cp-surfaces
  - name: solver
  - name: sessions
  - name: commits

paths:
  /healthz:
    get:
      tags: [meta]
      summary: DB-backed liveness check
      operationId: getHealthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: DB unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /stations:
    post:
      tags: [stations]
      summary: Create a station
      operationId: createStation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [stations]
      summary: List stations, optionally filtered by bbox
      operationId: listStations
      parameters:
        - name: bbox
          in: query
          description: |
            Bounding box as `minLng,minLat,maxLng,maxLat` (four
            comma-separated floats). When omitted, returns up to 1000
            stations ordered by created_at DESC.
          required: false
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Station' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /stations/{id}:
    parameters:
      - $ref: '#/components/parameters/StationId'
    get:
      tags: [stations]
      summary: Get a station with its photos, measurements, and referenced control points
      operationId: getStation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HydratedStation' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [stations]
      summary: Partial-update a station
      description: |
        Partial update: only the keys present in the request body are
        written. Omitting a key preserves its current value; sending an
        explicit `null` clears nullable columns (e.g. `name`).
      operationId: updateStation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [stations]
      summary: Delete a station and cascade
      description: |
        Cascades to photos and image measurements in the database, and
        removes photo blob files from disk. Control points referenced
        only from the deleted station are NOT cascade-deleted (they
        live cross-station) — they survive without measurements until
        explicitly removed.
      operationId: deleteStation
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /stations/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/StationId'
    post:
      tags: [photos]
      summary: Create a photo on a station (metadata only)
      description: |
        Creates a photo row with an empty blob slot. Upload the image bytes
        via `PUT /photos/{id}/blob` afterwards.
      operationId: createPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoPosePatch' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /photos:
    get:
      tags: [photos]
      summary: List all photos with per-photo observation counts
      description: |
        Returns every photo in the system (or session overlay when an
        `X-Session-Id` header is set), ordered by created_at ASC. Each
        item also carries `observation_count` — the number of image
        measurements anchored on that photo (counted from the main DB
        only, so in-session inserts/deletes are not reflected).
      operationId: listPhotos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PhotoListItem' }

  /photos/{id}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [photos]
      summary: Get photo metadata
      operationId: getPhoto
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [photos]
      summary: Partial-update photo pose / opacity / aspect / locks
      description: |
        Partial update: only the keys present in the request body are
        written. Omitting a key preserves its current value.
      operationId: updatePhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [photos]
      summary: Delete a photo (and its blob)
      operationId: deletePhoto
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /photos/{id}/blob:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    put:
      tags: [photos]
      summary: Upload the photo's image blob
      description: |
        Stores the uploaded bytes content-addressed at `blobs/<sha256>` and
        writes the resulting path into the photo's `blob_path`. Re-uploading
        different bytes produces a new hash; the previous bytes remain on
        disk and are still referenced by any prior commit's view of the row.
      operationId: uploadPhotoBlob
      requestBody:
        required: true
        content:
          'image/*':
            schema:
              type: string
              format: binary
      responses:
        '204': { description: Stored }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Payload too large (above MAX_BLOB_BYTES)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [photos]
      summary: Download the photo's image blob
      description: |
        Resolves the photo's `blob_path` (overlay-aware when `X-Session-Id`
        is supplied) and streams the bytes. Callers that already have the
        content hash should prefer `GET /blobs/{hash}`, which serves the
        bytes directly with immutable cache headers and works without a
        session lookup.
      operationId: getPhotoBlob
      responses:
        '200':
          description: OK
          content:
            'image/*':
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }

  /blobs/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    get:
      tags: [photos]
      summary: Download an image blob by its content hash
      description: |
        Content-addressed blob fetch. Bytes are immutable; the response is
        marked `Cache-Control: public, max-age=31536000, immutable`.
        Content-Type is sniffed from the first 512 bytes.
      operationId: getBlob
      responses:
        '200':
          description: OK
          content:
            'image/*':
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }

  /photos/{id}/image-measurements:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    post:
      tags: [image-measurements]
      summary: Create an image measurement on a photo
      operationId: createImageMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageMeasurementPatch' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageMeasurement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /image-measurements/{id}:
    parameters:
      - $ref: '#/components/parameters/ImageMeasurementId'
    put:
      tags: [image-measurements]
      summary: Partial-update an image measurement's u/v or control point link
      description: |
        Partial update: only the keys present in the request body are
        written. Sending `control_point_id: null` unlinks the measurement
        from its control point.
      operationId: updateImageMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageMeasurementUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageMeasurement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [image-measurements]
      summary: Delete an image measurement
      operationId: deleteImageMeasurement
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /control-points:
    post:
      tags: [control-points]
      summary: Create a control point
      description: |
        Control points are global (cross-station). Initial est_lat /
        est_lng / est_alt are optional; a CP without estimates is
        a "latent" landmark whose location is unknown until the solver
        triangulates from observations.
      operationId: createControlPoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlPointPatch' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [control-points]
      summary: List control points, optionally filtered by bbox
      operationId: listControlPoints
      parameters:
        - name: bbox
          in: query
          description: |
            Bounding box as `minLng,minLat,maxLng,maxLat`. Filter is
            applied to the CPs' est_lat/est_lng — CPs with NULL
            estimates are excluded when bbox is set. Returns up to 1000.
          required: false
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ControlPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /control-points/{id}:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    get:
      tags: [control-points]
      summary: Get a control point
      operationId: getControlPoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPoint' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [control-points]
      summary: Update a control point's description / estimates
      operationId: updateControlPoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlPointPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [control-points]
      summary: Delete a control point
      description: |
        Cascades `ON DELETE SET NULL` on referencing image and map
        measurements; both survive without their link.
      operationId: deleteControlPoint
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /control-point-fits:
    get:
      tags: [control-points]
      summary: List per-CP goodness-of-fit (angular residual RMS)
      description: |
        For every control point with a known est_lat/est_lng and at least
        one image measurement, returns the RMS angular residual between
        each observation's ray and the bearing from its station to the
        stored estimate. Same residual definition the solver minimizes.
        Surfaces a "two locations conflated into one CP" signal: tiny
        residuals mean observations agree on a single point; large ones
        mean they don't. est_alt NULL is treated as 0 (matches the
        solver). CPs without observations are omitted.
      operationId: listControlPointFits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPointFits' }

  /stations/{id}/cp-observations:
    parameters:
      - $ref: '#/components/parameters/StationId'
    post:
      tags: [cp-observations]
      summary: Mark a CP as present / absent / obscured at this station
      description: |
        Creates a per-station-per-CP observation row. Each (station, CP)
        pair is unique — POST returns 409 if a row already exists; use
        PUT /cp-observations/{id} to change an existing one.
      operationId: createCpObservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CpObservationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpObservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A cp_observation already exists for this (station, CP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cp-observations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    put:
      tags: [cp-observations]
      summary: Change the status on a cp_observation
      operationId: updateCpObservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CpObservationUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CpObservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [cp-observations]
      summary: Delete a cp_observation
      description: |
        Refuses with 409 if the observation is `observed` and there's
        still an image_measurement at this station referencing the CP —
        the pixel-pinned evidence has to be removed first.
      operationId: deleteCpObservation
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Observed evidence (image_measurement) still references this CP at this station
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /control-point-constraints:
    post:
      tags: [cp-constraints]
      summary: Create a pairwise constraint between two control points
      description: |
        Creates a hard equality constraint between two control points.
        The handler swaps `cp_a_id` and `cp_b_id` if necessary so the
        stored row satisfies the canonical `cp_a_id < cp_b_id` ordering.
        Self-loops (same id on both sides) and duplicate (a, b, type)
        triples are rejected.

        Type semantics:
          * `plumb` — the two CPs share `est_lat` and `est_lng`
          * `level` — the two CPs share `est_alt`
      operationId: createCPConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPConstraintCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CPConstraint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A constraint of this type already exists between this pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [cp-constraints]
      summary: List all pairwise control-point constraints
      operationId: listCPConstraints
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CPConstraint' }

  /control-point-constraints/{id}:
    parameters:
      - $ref: '#/components/parameters/CPConstraintId'
    put:
      tags: [cp-constraints]
      summary: Change the constraint type
      operationId: updateCPConstraint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPConstraintPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CPConstraint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [cp-constraints]
      summary: Delete a constraint
      operationId: deleteCPConstraint
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /control-point-surfaces:
    post:
      tags: [cp-surfaces]
      summary: Create a polygonal surface anchored on 3 or 4 control points
      description: |
        Creates a triangle (3 distinct CP ids) or quad (4 distinct CP ids) surface
        for visualization in the 3D world view. The four CP ids must be pairwise
        distinct; `cp_4_id` omitted or null yields a triangle. Surfaces have no
        editable fields after creation — modify by deleting and recreating.
      operationId: createCPSurface
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CPSurfaceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CPSurface' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [cp-surfaces]
      summary: List all CP surfaces
      operationId: listCPSurfaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CPSurface' }

  /control-point-surfaces/{id}:
    parameters:
      - $ref: '#/components/parameters/CPSurfaceId'
    delete:
      tags: [cp-surfaces]
      summary: Delete a surface
      operationId: deleteCPSurface
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /solve/joint:
    post:
      tags: [solver]
      summary: Bundle-adjust the entire system (stations + photos + control points)
      description: |
        Runs Gauss-Newton over every unlocked solvable parameter across all
        stations, photos, and control points. Requires at least two stations
        with both lat and lng locked (translation + rotation gauge); returns
        400 otherwise. Persists the result inside one transaction; uses
        optimistic concurrency on each row's `updated_at` and returns 409 if
        another writer raced the solve.
      operationId: solveJoint
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveConfig' }
      responses:
        '200':
          description: OK (incl. divergence; check `diverged`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Concurrent edit detected; re-fetch and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /solve/stations/{id}:
    parameters:
      - $ref: '#/components/parameters/StationId'
    post:
      tags: [solver]
      summary: Refine the photo poses of a single station
      description: |
        Solves the joint photo-pose problem for the given station, treating
        the station's own lat/lng and every control point's est_* as fixed.
        No gauge requirement (the station is the implicit anchor).
      operationId: solveStation
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveConfig' }
      responses:
        '200':
          description: OK (incl. divergence; check `diverged`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Concurrent edit detected; re-fetch and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /solve/control-points/{id}:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    post:
      tags: [solver]
      summary: Refine est_lat / est_lng / est_alt for a single control point
      description: |
        Triangulates the CP location from its image measurements across
        stations. Requires at least two image observations.
      operationId: solveControlPoint
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveConfig' }
      responses:
        '200':
          description: OK (incl. divergence; check `diverged`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Concurrent edit detected; re-fetch and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /control-points/{id}/observations:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    get:
      tags: [control-points]
      summary: List every observation referencing this control point
      description: |
        Returns image measurements across every station that link back
        to the given control point. Each row carries enough context
        (station id + name) for the caller to deep-link.
      operationId: listControlPointObservations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPointObservations' }
        '404': { $ref: '#/components/responses/NotFound' }

  /control-points/{id}/cp-observations:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    get:
      tags: [cp-observations]
      summary: List per-station observation rows for this control point
      description: |
        Returns every cp_observation row referencing this CP across
        every station. Used by the CP detail page to show which
        stations have marked this CP present / absent / obscured.
      operationId: listCpObservationsByControlPoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CpObservation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions:
    post:
      tags: [sessions]
      summary: Open a new session at HEAD
      description: |
        Sessions are server-issued anonymous workspaces. The id returned
        here is what the client persists in localStorage and sends back as
        `X-Session-Id` on every subsequent read/write to scope reads to the
        session overlay and writes to the journal.
      operationId: createSession
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }

  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [sessions]
      summary: Session metadata + ops summary + live conflict list
      operationId: getSession
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/ops:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [sessions]
      summary: Full journal of ops in seq order
      operationId: getSessionOps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionOp' }

  /sessions/{id}/rank-deficient:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [sessions]
      summary: |
        Read-only dry-run of the merge σ gate; returns the per-entity flagged
        axes the merge endpoint would block on. Empty list means clean.
      description: |
        Applies the session's ops inside a transaction we never commit, runs
        the same per-axis σ check the merge endpoint uses, then rolls back.
        Used by the session widget to surface "X problems" between Solve and
        Save without forcing the user to attempt the merge first.
      operationId: getSessionRankDeficient
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deficient_axes]
                properties:
                  deficient_axes:
                    type: array
                    items: { $ref: '#/components/schemas/RankDeficientAxis' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/abandon:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    post:
      tags: [sessions]
      summary: Mark a session as abandoned
      description: |
        Idempotent: returns 204 if already abandoned. Refuses with 409 if
        the session is merged (history is immutable).
      operationId: abandonSession
      responses:
        '204': { description: Abandoned }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session is already merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sessions/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    post:
      tags: [sessions]
      summary: Promote the session to a new commit on main
      description: |
        Coalesces session ops per entity, applies them to main inside one
        SERIALIZABLE transaction, and writes a new commit row referencing
        this session. Refuses with 409 if any entity touched by the
        session has been modified by a commit since the session's base.
      operationId: mergeSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeRequest' }
      responses:
        '201':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict — abandon and start over
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictsResponse' }
        '422':
          description: |
            Rank-deficient merge: one or more touched entities have a
            free-axis σ above the configured refuse threshold. Resubmit
            with allow_underdetermined=true to bypass.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankDeficientError' }

  /commits:
    get:
      tags: [commits]
      summary: List commits, latest first
      operationId: listCommits
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: before_seq
          in: query
          required: false
          description: Return commits whose seq is strictly less than this value (cursor pagination).
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Commit' }

  /commits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [commits]
      summary: One commit row plus the journaled ops it landed
      operationId: getCommit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitWithOps' }
        '404': { $ref: '#/components/responses/NotFound' }

  /commits/{id}/revert:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    post:
      tags: [commits]
      summary: Create a new commit that inverts the target's effect
      description: |
        Walks the target commit's journal backward, swaps before/after on
        each op, and applies the inverse plan to main. Refuses with 409 if
        any later commit has touched any of the target's entities.
      operationId: revertCommit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevertRequest' }
      responses:
        '201':
          description: Reverted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict — later commits have touched these entities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictsResponse' }

  /commits/{id}/revert_to_before:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    post:
      tags: [commits]
      summary: Revert state to just before this commit (range revert)
      description: |
        Applies a single new revert commit whose effect is the diff between
        current state and state-just-before-target. Covers every commit with
        seq in [target.seq, expected_latest_seq]. Refuses with 400 if the
        range contains any existing revert commit (those have no journaled
        ops and can't be cleanly composed); refuses with 409 if a newer
        commit has landed since the caller observed expected_latest_seq.
      operationId: revertCommitToBefore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevertToBeforeRequest' }
      responses:
        '201':
          description: Reverted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict — newer commits exist; refresh and retry

  /control-points/{id}/visible-photos:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    get:
      tags: [control-points]
      summary: List photos whose viewshed should contain this control point
      description: |
        Returns photos where the CP's estimated location falls inside the
        photo's horizontal field of view AND the station's capture time
        falls inside the CP's lifespan AND no image measurement for this
        CP exists yet on the photo. The result is the inverse of the
        observations list — candidate photos still missing a measurement.

        Returns an empty list (200) when the CP has no estimated
        location; the caller decides how to render that state.
      operationId: listControlPointVisiblePhotos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPointVisiblePhotos' }
        '404': { $ref: '#/components/responses/NotFound' }

  /control-points/{id}/inconsistency-reasons:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    get:
      tags: [control-points]
      summary: Explain why this control point's derived window is inconsistent
      description: |
        Returns the raw constraint contradictions that touch this CP's
        lifespan variables and remain infeasible under the propagated
        bounds. Each entry is a one-line description naming the involved
        entities and the bound values that violate the inequality.

        Returns an empty list (200) if the CP isn't currently inconsistent.
      operationId: getControlPointInconsistencyReasons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InconsistencyReasons' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stations/{id}/inconsistency-reasons:
    parameters:
      - $ref: '#/components/parameters/StationId'
    get:
      tags: [stations]
      summary: Explain why this station's derived capture window is inconsistent
      description: |
        Returns the raw constraint contradictions that touch this
        station's capture-time variable and remain infeasible under the
        propagated bounds. Each entry is a one-line description naming
        the involved entities and the bound values that violate the
        inequality.

        Returns an empty list (200) if the station isn't currently
        inconsistent.
      operationId: getStationInconsistencyReasons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InconsistencyReasons' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    StationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PhotoId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ImageMeasurementId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ControlPointId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CPConstraintId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CPSurfaceId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      description: 13-character base32 server-assigned id
      pattern: '^[A-Z2-7]{13}$'

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Station:
      type: object
      required: [id, lat, lng, alt, name, lock_lat, lock_lng, lock_alt, captured_at, derived_window, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        alt: { type: number, format: double, description: meters above sea level (defaults to 0 when unknown) }
        name: { type: string, nullable: true }
        lock_lat: { type: boolean, description: when true the solver leaves lat untouched }
        lock_lng: { type: boolean, description: when true the solver leaves lng untouched }
        lock_alt: { type: boolean, description: when true the solver treats alt as a fixed input }
        captured_at:
          type: string
          format: date-time
          nullable: true
          description: |
            when the photographer's camera was set up at this site. Optional —
            null means the date is unknown. Stations with a null captured_at
            participate in the cp_observation graph but contribute no temporal
            bounds to derived CP windows.
        derived_window: { $ref: '#/components/schemas/StationDerivedWindow' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sigma_lat:
          type: number
          format: double
          nullable: true
          description: |
            Standard deviation of lat at the last successful solve, in meters
            (local-ENU north). NULL until this station participates in a
            converged solve, or when the axis is fully unobservable.
        sigma_lng:
          type: number
          format: double
          nullable: true
          description: σ of lng in meters (local-ENU east). NULL semantics as sigma_lat.
        sigma_alt:
          type: number
          format: double
          nullable: true
          description: σ of alt in meters. NULL semantics as sigma_lat.
        cov_lat_lng:
          type: number
          format: double
          nullable: true
          description: |
            Off-diagonal east-north covariance at the last successful solve, in
            m² (local-ENU). With sigma_lat and sigma_lng this gives the full
            2×2 horizontal-position covariance the frontend uses to render a
            tilted error ellipse. NULL semantics as sigma_lat.

    Photo:
      type: object
      required:
        - id
        - station_id
        - blob_path
        - mime_type
        - size_bytes
        - aspect
        - photo_az
        - photo_tilt
        - photo_roll
        - size_rad
        - opacity
        - lock_photo_az
        - lock_photo_tilt
        - lock_photo_roll
        - lock_size_rad
        - dist_k1
        - dist_k2
        - lock_dist_k1
        - lock_dist_k2
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        station_id: { $ref: '#/components/schemas/Id' }
        blob_path:
          type: string
          nullable: true
          description: |
            Relative path under STORAGE_DIR where the photo's bytes live.
            New uploads land at `blobs/<sha256>` (content-addressed,
            immutable). Legacy rows may still carry `photos/<id>` until the
            startup migration rewrites them.
        mime_type: { type: string, nullable: true }
        size_bytes: { type: integer, format: int64, nullable: true }
        aspect: { type: number, format: double, description: width / height of the photo in pixels }
        photo_az: { type: number, format: double, description: viewer-azimuth radians (CCW from -Z) }
        photo_tilt: { type: number, format: double, description: viewer-altitude radians (above horizon) }
        photo_roll: { type: number, format: double, description: in-plane roll radians }
        size_rad: { type: number, format: double, description: horizontal angular subtense radians }
        opacity: { type: number, format: double, minimum: 0, maximum: 1 }
        lock_photo_az: { type: boolean }
        lock_photo_tilt: { type: boolean }
        lock_photo_roll: { type: boolean }
        lock_size_rad: { type: boolean }
        dist_k1: { type: number, format: double, description: Brown-Conrady radial distortion coefficient k1; 0 = no distortion }
        dist_k2: { type: number, format: double, description: Brown-Conrady radial distortion coefficient k2; 0 = no distortion }
        lock_dist_k1: { type: boolean, description: locked at zero by default; unlock to let the solver fit it }
        lock_dist_k2: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sigma_photo_az:
          type: number
          format: double
          nullable: true
          description: |
            Standard deviation of photo_az at the last successful solve,
            in radians. NULL until this photo participates in a converged
            solve, or when the axis is locked / fully unobservable.
        sigma_photo_tilt:
          type: number
          format: double
          nullable: true
          description: σ of photo_tilt in radians. NULL semantics as sigma_photo_az.
        sigma_photo_roll:
          type: number
          format: double
          nullable: true
          description: σ of photo_roll in radians. NULL semantics as sigma_photo_az.
        sigma_size_rad:
          type: number
          format: double
          nullable: true
          description: σ of size_rad in radians. NULL semantics as sigma_photo_az.
        sigma_dist_k1:
          type: number
          format: double
          nullable: true
          description: σ of dist_k1, dimensionless. NULL semantics as sigma_photo_az.
        sigma_dist_k2:
          type: number
          format: double
          nullable: true
          description: σ of dist_k2, dimensionless. NULL semantics as sigma_photo_az.

    PhotoListItem:
      type: object
      description: |
        Listing-only wrapper around Photo that adds the count of image
        measurements anchored on this photo. Per-axis σ values from the
        last successful solve are exposed inline on the Photo itself.
      required: [photo, observation_count]
      properties:
        photo: { $ref: '#/components/schemas/Photo' }
        observation_count: { type: integer, minimum: 0 }

    ImageMeasurement:
      type: object
      description: |
        Reticle anchor on a photo at (u, v): the user identifies that
        some control point is visible at this image-space position.
      required: [id, photo_id, u, v, control_point_id, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        photo_id: { $ref: '#/components/schemas/Id' }
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        control_point_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ControlPoint:
      type: object
      description: |
        A real-world landmark with a user-seeded location estimate
        (est_lat / est_lng / est_alt) and image-measurement observations
        across photos and stations. The estimate is set when the CP is
        created and refined by the location solver as observations accumulate.

        started_at / ended_at carry only precise, certain events. The
        derived_window object carries implicit bounds derived from
        cp_observations + station capture dates; those bounds are
        materialized at write time inside mergeSession.
      required:
        - id
        - description
        - notes
        - est_lat
        - est_lng
        - est_alt
        - started_at
        - ended_at
        - lock_est_lat
        - lock_est_lng
        - lock_est_alt
        - derived_window
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        description: { type: string }
        notes: { type: string, description: free-form prose describing the control point in detail }
        est_lat: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        est_lng: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
        est_alt: { type: number, format: double, nullable: true, description: meters above sea level; null when the elevation isn't known }
        started_at: { type: string, format: date-time, nullable: true, description: precise, certain event when the landmark began existing }
        ended_at: { type: string, format: date-time, nullable: true, description: precise, certain event when the landmark ceased to exist }
        lock_est_lat: { type: boolean }
        lock_est_lng: { type: boolean }
        lock_est_alt: { type: boolean }
        derived_window: { $ref: '#/components/schemas/DerivedWindow' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sigma_est_lat:
          type: number
          format: double
          nullable: true
          description: |
            σ of est_lat in meters (local-ENU north) at the last successful
            solve. NULL until this CP participates in a converged solve,
            or when the axis is locked / fully unobservable.
        sigma_est_lng:
          type: number
          format: double
          nullable: true
          description: σ of est_lng in meters (local-ENU east). NULL semantics as sigma_est_lat.
        sigma_est_alt:
          type: number
          format: double
          nullable: true
          description: σ of est_alt in meters. NULL semantics as sigma_est_lat.
        cov_est_lat_lng:
          type: number
          format: double
          nullable: true
          description: |
            Off-diagonal east-north covariance of (est_lat, est_lng) in m²
            (local-ENU). With sigma_est_lat and sigma_est_lng this gives the
            full 2×2 horizontal covariance the frontend uses to render a
            tilted error ellipse. NULL semantics as sigma_est_lat.

    ControlPointImageObservation:
      type: object
      required:
        - id
        - photo_id
        - u
        - v
        - station_id
        - station_name
        - station_lat
        - station_lng
        - station_captured_at
        - station_derived_window
        - photo_az
        - photo_tilt
        - photo_roll
        - size_rad
        - aspect
      properties:
        id: { $ref: '#/components/schemas/Id' }
        photo_id: { $ref: '#/components/schemas/Id' }
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        station_id: { $ref: '#/components/schemas/Id' }
        station_name: { type: string, nullable: true }
        station_lat: { type: number, format: double, minimum: -90, maximum: 90 }
        station_lng: { type: number, format: double, minimum: -180, maximum: 180 }
        station_captured_at: { type: string, format: date-time, nullable: true }
        station_derived_window: { $ref: '#/components/schemas/StationDerivedWindow' }
        photo_az: { type: number, format: double }
        photo_tilt: { type: number, format: double }
        photo_roll: { type: number, format: double }
        size_rad: { type: number, format: double }
        aspect: { type: number, format: double }

    ControlPointObservations:
      type: object
      required: [image_measurements]
      properties:
        image_measurements:
          type: array
          items: { $ref: '#/components/schemas/ControlPointImageObservation' }

    ControlPointVisiblePhoto:
      type: object
      description: |
        A photo whose horizontal viewshed contains the CP's estimated
        location and whose station capture time falls within the CP's
        derived window (or has no temporal evidence either way), but
        which has no image measurement linking to the CP yet. Pose and
        station coordinates used for the server-side viewshed test are
        intentionally not exposed.
      required:
        - photo_id
        - station_id
        - station_name
        - station_captured_at
        - station_derived_window
        - distance_m
      properties:
        photo_id: { $ref: '#/components/schemas/Id' }
        station_id: { $ref: '#/components/schemas/Id' }
        station_name: { type: string, nullable: true }
        station_captured_at: { type: string, format: date-time, nullable: true }
        station_derived_window: { $ref: '#/components/schemas/StationDerivedWindow' }
        distance_m: { type: number, format: double, description: "Horizontal distance from the station to the CP's stored estimate, in meters." }

    ControlPointVisiblePhotos:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items: { $ref: '#/components/schemas/ControlPointVisiblePhoto' }

    InconsistencyReason:
      type: object
      description: |
        One contradicting constraint touching the queried entity, with
        attribution for each bound value it cites.
      required: [text, bound_sources]
      properties:
        text:
          type: string
          description: |
            One-line description of the violated constraint, naming the
            involved entities and the bound values that fail the inequality.
        bound_sources:
          type: array
          description: |
            One entry per bound value cited in `text`, naming the
            constraint (or precise-date seed) that last set that bound.
            Lets the user identify the *other* observation contributing
            to the contradiction, not just the violated one.
          items: { type: string }

    InconsistencyReasons:
      type: object
      description: |
        Response shape for `GET /{stations,control-points}/{id}/inconsistency-reasons`.
        Empty list iff the entity isn't currently inconsistent.
      required: [reasons]
      properties:
        reasons:
          type: array
          items: { $ref: '#/components/schemas/InconsistencyReason' }

    ControlPointFit:
      type: object
      description: |
        Goodness-of-fit summary for one CP. fit_rms_rad is the RMS angular
        residual (radians) between every observation's image-plane ray and
        the bearing from its station to the CP's stored estimate — same
        residual the solver minimizes. observation_count is the number of
        image measurements that contributed.
      required: [id, fit_rms_rad, observation_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fit_rms_rad: { type: number, format: double, minimum: 0 }
        observation_count: { type: integer, minimum: 1 }

    ControlPointFits:
      type: object
      required: [control_points]
      properties:
        control_points:
          type: array
          items: { $ref: '#/components/schemas/ControlPointFit' }

    HydratedStation:
      type: object
      required: [station, photos, image_measurements, control_points, cp_observations]
      properties:
        station: { $ref: '#/components/schemas/Station' }
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        image_measurements:
          type: array
          items: { $ref: '#/components/schemas/ImageMeasurement' }
        control_points:
          type: array
          description: |
            Control points reachable from this station — i.e., those
            referenced by at least one of this station's measurements
            *or* by a cp_observation row at this station.
          items: { $ref: '#/components/schemas/ControlPoint' }
        cp_observations:
          type: array
          description: Per-CP observation status rows for this station.
          items: { $ref: '#/components/schemas/CpObservation' }

    CreateStationRequest:
      type: object
      description: |
        POST body. lat/lng are required; other fields default if omitted.
        captured_at may be omitted or null when the date is unknown.
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        alt: { type: number, format: double, description: defaults to 0 when omitted }
        name: { type: string, nullable: true }
        lock_lat: { type: boolean, description: defaults to true when omitted }
        lock_lng: { type: boolean, description: defaults to true when omitted }
        lock_alt: { type: boolean, description: defaults to true when omitted }
        captured_at: { type: string, format: date-time, nullable: true }

    StationUpdate:
      type: object
      description: |
        Partial-update body for PUT /stations/{id}. Every field is
        optional; only keys present in the body are written. Sending
        `name: null` clears the name. Sending `captured_at: null`
        clears the date.
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        alt: { type: number, format: double }
        name: { type: string, nullable: true }
        lock_lat: { type: boolean }
        lock_lng: { type: boolean }
        lock_alt: { type: boolean }
        captured_at: { type: string, format: date-time, nullable: true }

    PhotoPosePatch:
      type: object
      description: |
        POST body for `POST /stations/{id}/photos`. Pose fields are
        required; opacity / lock_* / dist_k* default if omitted.
      required: [aspect, photo_az, photo_tilt, photo_roll, size_rad]
      properties:
        aspect: { type: number, format: double }
        photo_az: { type: number, format: double }
        photo_tilt: { type: number, format: double }
        photo_roll: { type: number, format: double }
        size_rad: { type: number, format: double }
        opacity: { type: number, format: double, minimum: 0, maximum: 1 }
        lock_photo_az: { type: boolean, description: defaults to true when omitted }
        lock_photo_tilt: { type: boolean }
        lock_photo_roll: { type: boolean }
        lock_size_rad: { type: boolean }
        dist_k1: { type: number, format: double, description: defaults to 0 when omitted }
        dist_k2: { type: number, format: double }
        lock_dist_k1: { type: boolean, description: defaults to true when omitted }
        lock_dist_k2: { type: boolean }

    PhotoUpdate:
      type: object
      description: |
        Partial-update body for PUT /photos/{id}. Every field is
        optional; only keys present in the body are written.
      properties:
        aspect: { type: number, format: double }
        photo_az: { type: number, format: double }
        photo_tilt: { type: number, format: double }
        photo_roll: { type: number, format: double }
        size_rad: { type: number, format: double }
        opacity: { type: number, format: double, minimum: 0, maximum: 1 }
        lock_photo_az: { type: boolean }
        lock_photo_tilt: { type: boolean }
        lock_photo_roll: { type: boolean }
        lock_size_rad: { type: boolean }
        dist_k1: { type: number, format: double }
        dist_k2: { type: number, format: double }
        lock_dist_k1: { type: boolean }
        lock_dist_k2: { type: boolean }

    ImageMeasurementPatch:
      type: object
      description: |
        POST body for `POST /photos/{id}/image-measurements`. u/v
        required; control_point_id optional (null = unlinked).
      required: [u, v]
      properties:
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        control_point_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true

    ImageMeasurementUpdate:
      type: object
      description: |
        Partial-update body for PUT /image-measurements/{id}. Every
        field optional. `control_point_id: null` unlinks.
      properties:
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        control_point_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true

    ControlPointPatch:
      type: object
      description: |
        Body for both `POST /control-points` and `PUT
        /control-points/{id}`. Every field optional. On POST, omitted
        fields take their column defaults; on PUT, omitted fields are
        preserved. started_at / ended_at carry only precise, certain
        events; implicit bounds are derived server-side.
      properties:
        description: { type: string }
        notes: { type: string }
        est_lat: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        est_lng: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
        est_alt: { type: number, format: double, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        lock_est_lat: { type: boolean }
        lock_est_lng: { type: boolean }
        lock_est_alt: { type: boolean }

    DerivedWindow:
      type: object
      description: |
        Implicit lifespan bounds for a control point, derived from its
        cp_observations and the capture dates of the stations they
        anchor on. Recomputed at write time inside mergeSession; reads
        return the materialized values directly.

        started_at_lower / started_at_upper bracket when the CP began
        existing; ended_at_lower / ended_at_upper bracket when it
        ceased. A precise CP date (started_at / ended_at on the parent)
        appears as both the lower and upper of its side. inconsistent
        is true when the observation graph has contradictions for this
        CP (e.g. a "missing" observation falls strictly between two
        "observed" observations).
      required: [started_at_lower, started_at_upper, ended_at_lower, ended_at_upper, inconsistent]
      properties:
        started_at_lower: { type: string, format: date-time, nullable: true }
        started_at_upper: { type: string, format: date-time, nullable: true }
        ended_at_lower:   { type: string, format: date-time, nullable: true }
        ended_at_upper:   { type: string, format: date-time, nullable: true }
        inconsistent:     { type: boolean }

    StationDerivedWindow:
      type: object
      description: |
        Implicit capture-time bounds for a station, derived from its
        cp_observations and the lifespan of the CPs they reference.
        Station is a single time-point variable (not an interval), so
        the window is just (lower, upper). A precise captured_at on the
        parent appears as both the lower and upper. inconsistent is
        true when the observation graph constrains this station's
        capture time to an empty interval (e.g. observing two CPs
        with non-overlapping lifespans).
      required: [captured_at_lower, captured_at_upper, inconsistent]
      properties:
        captured_at_lower: { type: string, format: date-time, nullable: true }
        captured_at_upper: { type: string, format: date-time, nullable: true }
        inconsistent:      { type: boolean }

    CpObservationStatus:
      type: string
      enum: [present, absent, obscured]
      description: |
        present  — CP visible from at least one of the station's photos.
        absent   — CP would be visible but isn't (born after / destroyed before).
        obscured — CP can't be observed for non-temporal reasons (occluded, unclear, etc.).

    CpObservation:
      type: object
      required: [id, station_id, control_point_id, status, created_at, updated_at]
      properties:
        id:               { $ref: '#/components/schemas/Id' }
        station_id:       { $ref: '#/components/schemas/Id' }
        control_point_id: { $ref: '#/components/schemas/Id' }
        status:           { $ref: '#/components/schemas/CpObservationStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CpObservationCreate:
      type: object
      required: [control_point_id, status]
      description: |
        POST body. station_id comes from the path.
      properties:
        control_point_id: { $ref: '#/components/schemas/Id' }
        status:           { $ref: '#/components/schemas/CpObservationStatus' }

    CpObservationUpdate:
      type: object
      description: |
        Partial-update body. Only status can be changed.
      properties:
        status: { $ref: '#/components/schemas/CpObservationStatus' }

    CPConstraintType:
      type: string
      enum: [plumb, level]
      description: |
        plumb: cp_a and cp_b share est_lat and est_lng (vertical line);
        level: cp_a and cp_b share est_alt (horizontal alignment).

    CPConstraint:
      type: object
      required: [id, cp_a_id, cp_b_id, constraint_type, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        cp_a_id: { $ref: '#/components/schemas/Id' }
        cp_b_id: { $ref: '#/components/schemas/Id' }
        constraint_type: { $ref: '#/components/schemas/CPConstraintType' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CPConstraintCreate:
      type: object
      required: [cp_a_id, cp_b_id, constraint_type]
      description: |
        POST body for `/control-point-constraints`. The handler
        swaps `cp_a_id` and `cp_b_id` if needed to satisfy the
        canonical `cp_a_id < cp_b_id` ordering before insert.
      properties:
        cp_a_id: { $ref: '#/components/schemas/Id' }
        cp_b_id: { $ref: '#/components/schemas/Id' }
        constraint_type: { $ref: '#/components/schemas/CPConstraintType' }

    CPConstraintPatch:
      type: object
      description: |
        Partial-update body. Only `constraint_type` is mutable.
      properties:
        constraint_type: { $ref: '#/components/schemas/CPConstraintType' }

    CPSurface:
      type: object
      required: [id, cp_1_id, cp_2_id, cp_3_id, created_at, updated_at]
      description: |
        Polygonal surface anchored on 3 (triangle, cp_4_id null) or 4 (quad)
        control points. Surfaces are visualization-only; the solver doesn't
        read them.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        cp_1_id: { $ref: '#/components/schemas/Id' }
        cp_2_id: { $ref: '#/components/schemas/Id' }
        cp_3_id: { $ref: '#/components/schemas/Id' }
        cp_4_id:
          allOf:
            - { $ref: '#/components/schemas/Id' }
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CPSurfaceCreate:
      type: object
      required: [cp_1_id, cp_2_id, cp_3_id]
      description: |
        POST body for `/control-point-surfaces`. cp_4_id null or omitted
        makes a triangle; otherwise a quad. All non-null ids must be
        pairwise distinct.
      properties:
        cp_1_id: { $ref: '#/components/schemas/Id' }
        cp_2_id: { $ref: '#/components/schemas/Id' }
        cp_3_id: { $ref: '#/components/schemas/Id' }
        cp_4_id:
          allOf:
            - { $ref: '#/components/schemas/Id' }
          nullable: true

    SolveConfig:
      type: object
      description: |
        Optional knobs for the solver. Defaults are used when omitted.
      properties:
        max_iters: { type: integer, minimum: 1, maximum: 10000, description: GN iteration cap (synchronous default 30, streaming default 1000) }
        function_tol: { type: number, format: double, description: "Relative cost-reduction convergence threshold — maps to Ceres options.function_tolerance. Default 1e-4 = stop when each iteration reduces total cost by less than 0.01 %." }
        step_tol: { type: number, format: double, description: "Relative state-vector step-size convergence threshold — maps to Ceres options.parameter_tolerance. Default 1e-7." }
        k_reg_lambda: { type: number, format: double, description: Tikhonov regularization weight on photo dist_k1 / dist_k2 lens-distortion slots (default 0.05; pass any negative value to disable, leave omitted to use the default) }
        position_reg_lambda: { type: number, format: double, description: "Tikhonov prior on each unlocked station's ENU offset (meters) from its user-supplied lat/lng. Each axis adds residual √λ·offset_m. Default 0 (off). Useful range ~1e-8 to 1e-3; λ=(σ_residual_rad/σ_position_m)²." }
        dry_run:
          type: boolean
          description: |
            When true, run the solver but skip the DB writeback. The response
            still carries iterations, residuals, auto_locked_columns, and the
            diff that would have been applied. Useful for diagnosis.

    RankDeficientAxis:
      type: object
      description: |
        One entity whose free parameters are geometrically unobservable
        under the requested solve mode. Returned in the 422 body when the
        merge gate refuses.
      required: [kind, id, axes, reason]
      properties:
        kind:
          type: string
          enum: [station, photo, control_point]
        id: { $ref: '#/components/schemas/Id' }
        axes:
          type: array
          items: { type: string }
          description: Field names per kind (e.g. ["lat","lng"] for station, ["photo_az"] for photo).
        reason:
          type: string
          description: Human-readable explanation.
        station_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true
          description: |
            For kind=photo, the station that owns this photo. Lets clients
            build deep links into the photo's station view (e.g.
            /world?sta=<station_id>&focus=<id>). Absent (null) for kinds
            station / control_point.

    RankDeficientError:
      type: object
      description: |
        Body of the 422 returned by /sessions/{id}/merge when any touched
        entity's free-axis σ from the last solve exceeds the merge gate's
        refuse threshold. Resubmit MergeRequest with
        `allow_underdetermined: true` to bypass.
      required: [error, deficient_axes]
      properties:
        error:
          type: string
          enum: [rank_deficient]
        deficient_axes:
          type: array
          items: { $ref: '#/components/schemas/RankDeficientAxis' }

    EntityChange:
      type: object
      description: One row's before/after for the keys the solver actually moved.
      required: [kind, id, before, after]
      properties:
        kind:
          type: string
          enum: [station, photo, control_point]
        id: { $ref: '#/components/schemas/Id' }
        before:
          type: object
          additionalProperties: { type: number, format: double }
        after:
          type: object
          additionalProperties: { type: number, format: double }

    CreateSessionResponse:
      type: object
      required: [id, base_seq, status, next_seq, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        base_seq: { type: integer, format: int64, description: HEAD seq the session forked from (0 if commit log is empty) }
        status: { type: string, enum: [open, merged, abandoned] }
        next_seq: { type: integer, format: int64, description: Next per-session op sequence to be assigned }
        created_at: { type: string, format: date-time }

    EntityRef:
      type: object
      description: |
        One entity touched by a session, optionally annotated with the
        last-commit seq that updated it on main.
      required: [entity_type, entity_id]
      properties:
        entity_type:
          type: string
          enum: [station, photo, image_measurement, control_point, cp_constraint, cp_surface, cp_observation]
        entity_id: { $ref: '#/components/schemas/Id' }
        last_seq: { type: integer, format: int64, nullable: true }

    SessionState:
      type: object
      required: [id, base_seq, status, next_seq, op_count, touched_entities, conflicts, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        base_seq: { type: integer, format: int64 }
        status: { type: string, enum: [open, merged, abandoned] }
        next_seq: { type: integer, format: int64 }
        op_count: { type: integer, format: int64, description: number of journaled ops (= next_seq - 1) }
        touched_entities:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
        conflicts:
          type: array
          description: |
            Touched entities whose entity_commits.last_seq exceeds
            base_seq — these are the entities that block a merge.
          items: { $ref: '#/components/schemas/EntityRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SessionOp:
      type: object
      required: [seq, entity_type, entity_id, op]
      properties:
        seq: { type: integer, format: int64 }
        entity_type:
          type: string
          enum: [station, photo, image_measurement, control_point, cp_constraint, cp_surface, cp_observation]
        entity_id: { $ref: '#/components/schemas/Id' }
        op:
          type: string
          enum: [insert, update, delete]
        before:
          description: Row state before the op (NULL for inserts).
          nullable: true
        after:
          description: Row state after the op (NULL for deletes).
          nullable: true

    CommitMessage:
      type: object
      properties:
        message: { type: string }

    MergeRequest:
      type: object
      required: [sign_off]
      properties:
        sign_off: { type: string, minLength: 1 }
        message: { type: string }
        allow_underdetermined:
          type: boolean
          description: |
            When false (default), merge refuses if any entity touched by the
            session has a free-axis σ above the configured threshold. Set
            true to override after the user reviews the flagged axes.

    RevertRequest:
      type: object
      required: [sign_off]
      properties:
        sign_off: { type: string, minLength: 1 }
        message: { type: string }

    RevertToBeforeRequest:
      type: object
      required: [sign_off, expected_latest_seq]
      properties:
        sign_off: { type: string, minLength: 1 }
        message: { type: string }
        expected_latest_seq:
          type: integer
          format: int64
          description: |
            MAX(commits.seq) the caller observed before clicking. Rejected
            with 409 if any commit has landed since.

    CommitRef:
      type: object
      required: [commit_id, seq]
      properties:
        commit_id: { $ref: '#/components/schemas/Id' }
        seq: { type: integer, format: int64 }

    Commit:
      type: object
      required: [id, seq, kind, sign_off, created_at, op_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        seq: { type: integer, format: int64 }
        parent_seq: { type: integer, format: int64, nullable: true }
        source_session_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true
        kind: { type: string, enum: [merge, revert] }
        reverts_commit_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true
        message: { type: string, nullable: true }
        sign_off: { type: string }
        created_at: { type: string, format: date-time }
        op_count:
          type: integer
          description: number of entity changes in this commit (for revert commits, the count from the commit being reverted)
        error_count:
          type: integer
          nullable: true
          description: |
            Number of merge-gate-flagged entities the user bypassed when
            saving (allow_underdetermined=true). Always populated for new
            merges (0 when the gate was clean); NULL on legacy commits and
            on revert commits.
        fit_score:
          type: number
          format: double
          nullable: true
          description: |
            final_residual_rms of the most recent solver run in the session
            that produced this commit. NULL when no solve ran in the
            session, on legacy commits, and on revert commits.

    CommitWithOps:
      type: object
      required: [commit, ops]
      properties:
        commit: { $ref: '#/components/schemas/Commit' }
        ops:
          type: array
          items: { $ref: '#/components/schemas/SessionOp' }

    ConflictsResponse:
      type: object
      required: [error, conflicts]
      properties:
        error: { type: string }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }

    SolveResult:
      type: object
      required: [iterations, initial_residual_rms, final_residual_rms, converged, diverged, changes]
      properties:
        iterations: { type: integer }
        initial_residual_rms: { type: number, format: double }
        final_residual_rms: { type: number, format: double }
        converged: { type: boolean, description: residual or step tolerance reached }
        diverged: { type: boolean, description: solver could not improve the initial residual; no changes were applied }
        auto_locked_columns:
          type: array
          description: |
            Free parameters whose Jacobian column was effectively zero — usually
            an unobservable parameter (e.g. est_alt of a CP only seen by one
            station). The solver pinned them for this run.
          items: { type: string }
        changes:
          type: array
          items: { $ref: '#/components/schemas/EntityChange' }
