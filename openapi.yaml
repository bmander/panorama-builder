openapi: 3.0.3
info:
  title: panorama-builder API
  description: |
    JSON API for compositing flat photos into a 360° panorama. Stores
    stations (camera setups), photos (with embedded pose), image
    measurements (reticle anchors on photos), and control points
    (cross-station landmarks with a user-seeded location estimate).

    Image measurements link to a control point; the CP is the latent
    real-world feature each observation describes.

    All resources use server-assigned 13-character base32 IDs.
    Authentication is out of scope — anyone with the URL has read+write
    access. Field-level validation lives in handler code; this spec
    documents shapes only.
  version: 1.0.0

servers:
  - url: /api

tags:
  - name: meta
  - name: stations
  - name: photos
  - name: image-measurements
  - name: control-points
  - name: solver

paths:
  /healthz:
    get:
      tags: [meta]
      summary: DB-backed liveness check
      operationId: getHealthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: DB unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /stations:
    post:
      tags: [stations]
      summary: Create a station
      operationId: createStation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [stations]
      summary: List stations, optionally filtered by bbox
      operationId: listStations
      parameters:
        - name: bbox
          in: query
          description: |
            Bounding box as `minLng,minLat,maxLng,maxLat` (four
            comma-separated floats). When omitted, returns up to 1000
            stations ordered by created_at DESC.
          required: false
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Station' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /stations/{id}:
    parameters:
      - $ref: '#/components/parameters/StationId'
    get:
      tags: [stations]
      summary: Get a station with its photos, measurements, and referenced control points
      operationId: getStation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HydratedStation' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [stations]
      summary: Partial-update a station
      description: |
        Partial update: only the keys present in the request body are
        written. Omitting a key preserves its current value; sending an
        explicit `null` clears nullable columns (e.g. `name`).
      operationId: updateStation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [stations]
      summary: Delete a station and cascade
      description: |
        Cascades to photos and image measurements in the database, and
        removes photo blob files from disk. Control points referenced
        only from the deleted station are NOT cascade-deleted (they
        live cross-station) — they survive without measurements until
        explicitly removed.
      operationId: deleteStation
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /stations/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/StationId'
    post:
      tags: [photos]
      summary: Create a photo on a station (metadata only)
      description: |
        Creates a photo row with an empty blob slot. Upload the image bytes
        via `PUT /photos/{id}/blob` afterwards.
      operationId: createPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoPosePatch' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /photos/{id}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [photos]
      summary: Get photo metadata
      operationId: getPhoto
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [photos]
      summary: Partial-update photo pose / opacity / aspect / locks
      description: |
        Partial update: only the keys present in the request body are
        written. Omitting a key preserves its current value.
      operationId: updatePhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [photos]
      summary: Delete a photo (and its blob)
      operationId: deletePhoto
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /photos/{id}/blob:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    put:
      tags: [photos]
      summary: Upload the photo's image blob
      operationId: uploadPhotoBlob
      requestBody:
        required: true
        content:
          'image/*':
            schema:
              type: string
              format: binary
      responses:
        '204': { description: Stored }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Payload too large (above MAX_BLOB_BYTES)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [photos]
      summary: Download the photo's image blob
      operationId: getPhotoBlob
      responses:
        '200':
          description: OK
          content:
            'image/*':
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }

  /photos/{id}/image-measurements:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    post:
      tags: [image-measurements]
      summary: Create an image measurement on a photo
      operationId: createImageMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageMeasurementPatch' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageMeasurement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /image-measurements/{id}:
    parameters:
      - $ref: '#/components/parameters/ImageMeasurementId'
    put:
      tags: [image-measurements]
      summary: Partial-update an image measurement's u/v or control point link
      description: |
        Partial update: only the keys present in the request body are
        written. Sending `control_point_id: null` unlinks the measurement
        from its control point.
      operationId: updateImageMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageMeasurementUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageMeasurement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [image-measurements]
      summary: Delete an image measurement
      operationId: deleteImageMeasurement
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /control-points:
    post:
      tags: [control-points]
      summary: Create a control point
      description: |
        Control points are global (cross-station). Initial est_lat /
        est_lng / est_alt are optional; a CP without estimates is
        a "latent" landmark whose location is unknown until the solver
        triangulates from observations.
      operationId: createControlPoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlPointPatch' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [control-points]
      summary: List control points, optionally filtered by bbox
      operationId: listControlPoints
      parameters:
        - name: bbox
          in: query
          description: |
            Bounding box as `minLng,minLat,maxLng,maxLat`. Filter is
            applied to the CPs' est_lat/est_lng — CPs with NULL
            estimates are excluded when bbox is set. Returns up to 1000.
          required: false
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ControlPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /control-points/{id}:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    get:
      tags: [control-points]
      summary: Get a control point
      operationId: getControlPoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPoint' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [control-points]
      summary: Update a control point's description / estimates
      operationId: updateControlPoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlPointPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [control-points]
      summary: Delete a control point
      description: |
        Cascades `ON DELETE SET NULL` on referencing image and map
        measurements; both survive without their link.
      operationId: deleteControlPoint
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /solve/joint:
    post:
      tags: [solver]
      summary: Bundle-adjust the entire system (stations + photos + control points)
      description: |
        Runs Gauss-Newton over every unlocked solvable parameter across all
        stations, photos, and control points. Requires at least two stations
        with both lat and lng locked (translation + rotation gauge); returns
        400 otherwise. Persists the result inside one transaction; uses
        optimistic concurrency on each row's `updated_at` and returns 409 if
        another writer raced the solve.
      operationId: solveJoint
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveConfig' }
      responses:
        '200':
          description: OK (incl. divergence; check `diverged`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Concurrent edit detected; re-fetch and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /solve/stations/{id}:
    parameters:
      - $ref: '#/components/parameters/StationId'
    post:
      tags: [solver]
      summary: Refine the photo poses of a single station
      description: |
        Solves the joint photo-pose problem for the given station, treating
        the station's own lat/lng and every control point's est_* as fixed.
        No gauge requirement (the station is the implicit anchor).
      operationId: solveStation
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveConfig' }
      responses:
        '200':
          description: OK (incl. divergence; check `diverged`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Concurrent edit detected; re-fetch and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /solve/control-points/{id}:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    post:
      tags: [solver]
      summary: Refine est_lat / est_lng / est_alt for a single control point
      description: |
        Triangulates the CP location from its image measurements across
        stations. Requires at least two image observations.
      operationId: solveControlPoint
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveConfig' }
      responses:
        '200':
          description: OK (incl. divergence; check `diverged`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Concurrent edit detected; re-fetch and retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /control-points/{id}/observations:
    parameters:
      - $ref: '#/components/parameters/ControlPointId'
    get:
      tags: [control-points]
      summary: List every observation referencing this control point
      description: |
        Returns image measurements across every station that link back
        to the given control point. Each row carries enough context
        (station id + name) for the caller to deep-link.
      operationId: listControlPointObservations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPointObservations' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    StationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PhotoId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ImageMeasurementId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ControlPointId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      description: 13-character base32 server-assigned id
      pattern: '^[A-Z2-7]{13}$'

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Station:
      type: object
      required: [id, lat, lng, alt, name, lock_lat, lock_lng, lock_alt, captured_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        alt: { type: number, format: double, description: meters above sea level (defaults to 0 when unknown) }
        name: { type: string, nullable: true }
        lock_lat: { type: boolean, description: when true the solver leaves lat untouched }
        lock_lng: { type: boolean, description: when true the solver leaves lng untouched }
        lock_alt: { type: boolean, description: when true the solver treats alt as a fixed input }
        captured_at:
          type: string
          format: date-time
          description: when the photographer's camera was set up at this site
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Photo:
      type: object
      required:
        - id
        - station_id
        - blob_path
        - mime_type
        - size_bytes
        - aspect
        - photo_az
        - photo_tilt
        - photo_roll
        - size_rad
        - opacity
        - lock_photo_az
        - lock_photo_tilt
        - lock_photo_roll
        - lock_size_rad
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        station_id: { $ref: '#/components/schemas/Id' }
        blob_path: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
        size_bytes: { type: integer, format: int64, nullable: true }
        aspect: { type: number, format: double, description: width / height of the photo in pixels }
        photo_az: { type: number, format: double, description: viewer-azimuth radians (CCW from -Z) }
        photo_tilt: { type: number, format: double, description: viewer-altitude radians (above horizon) }
        photo_roll: { type: number, format: double, description: in-plane roll radians }
        size_rad: { type: number, format: double, description: horizontal angular subtense radians }
        opacity: { type: number, format: double, minimum: 0, maximum: 1 }
        lock_photo_az: { type: boolean }
        lock_photo_tilt: { type: boolean }
        lock_photo_roll: { type: boolean }
        lock_size_rad: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImageMeasurement:
      type: object
      description: |
        Reticle anchor on a photo at (u, v): the user identifies that
        some control point is visible at this image-space position.
      required: [id, photo_id, u, v, control_point_id, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        photo_id: { $ref: '#/components/schemas/Id' }
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        control_point_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ControlPoint:
      type: object
      description: |
        A real-world landmark with a user-seeded location estimate
        (est_lat / est_lng / est_alt) and image-measurement observations
        across photos and stations. The estimate is set when the CP is
        created and refined by the location solver as observations accumulate.
      required:
        - id
        - description
        - notes
        - est_lat
        - est_lng
        - est_alt
        - started_at
        - ended_at
        - lock_est_lat
        - lock_est_lng
        - lock_est_alt
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        description: { type: string }
        notes: { type: string, description: free-form prose describing the control point in detail }
        est_lat: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        est_lng: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
        est_alt: { type: number, format: double, nullable: true, description: meters above sea level; null when the elevation isn't known }
        started_at: { type: string, format: date-time, nullable: true, description: when the landmark began existing }
        ended_at: { type: string, format: date-time, nullable: true, description: when the landmark ceased to exist }
        lock_est_lat: { type: boolean }
        lock_est_lng: { type: boolean }
        lock_est_alt: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ControlPointImageObservation:
      type: object
      required:
        - id
        - photo_id
        - u
        - v
        - station_id
        - station_name
        - station_lat
        - station_lng
        - station_captured_at
        - photo_az
        - photo_tilt
        - photo_roll
        - size_rad
        - aspect
      properties:
        id: { $ref: '#/components/schemas/Id' }
        photo_id: { $ref: '#/components/schemas/Id' }
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        station_id: { $ref: '#/components/schemas/Id' }
        station_name: { type: string, nullable: true }
        station_lat: { type: number, format: double, minimum: -90, maximum: 90 }
        station_lng: { type: number, format: double, minimum: -180, maximum: 180 }
        station_captured_at: { type: string, format: date-time }
        photo_az: { type: number, format: double }
        photo_tilt: { type: number, format: double }
        photo_roll: { type: number, format: double }
        size_rad: { type: number, format: double }
        aspect: { type: number, format: double }

    ControlPointObservations:
      type: object
      required: [image_measurements]
      properties:
        image_measurements:
          type: array
          items: { $ref: '#/components/schemas/ControlPointImageObservation' }

    HydratedStation:
      type: object
      required: [station, photos, image_measurements, control_points]
      properties:
        station: { $ref: '#/components/schemas/Station' }
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
        image_measurements:
          type: array
          items: { $ref: '#/components/schemas/ImageMeasurement' }
        control_points:
          type: array
          description: |
            Control points reachable from this station — i.e., those
            referenced by at least one of this station's measurements.
            Other CPs (in other stations) are not included.
          items: { $ref: '#/components/schemas/ControlPoint' }

    CreateStationRequest:
      type: object
      description: |
        POST body. lat/lng/captured_at are required; other fields default if omitted.
      required: [lat, lng, captured_at]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        alt: { type: number, format: double, description: defaults to 0 when omitted }
        name: { type: string, nullable: true }
        lock_lat: { type: boolean, description: defaults to false when omitted }
        lock_lng: { type: boolean }
        lock_alt: { type: boolean }
        captured_at: { type: string, format: date-time }

    StationUpdate:
      type: object
      description: |
        Partial-update body for PUT /stations/{id}. Every field is
        optional; only keys present in the body are written. Sending
        `name: null` clears the name. `captured_at`, when present,
        must be a non-null date-time.
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        alt: { type: number, format: double }
        name: { type: string, nullable: true }
        lock_lat: { type: boolean }
        lock_lng: { type: boolean }
        lock_alt: { type: boolean }
        captured_at: { type: string, format: date-time }

    PhotoPosePatch:
      type: object
      description: |
        POST body for `POST /stations/{id}/photos`. Pose fields are
        required; opacity / lock_* default if omitted.
      required: [aspect, photo_az, photo_tilt, photo_roll, size_rad]
      properties:
        aspect: { type: number, format: double }
        photo_az: { type: number, format: double }
        photo_tilt: { type: number, format: double }
        photo_roll: { type: number, format: double }
        size_rad: { type: number, format: double }
        opacity: { type: number, format: double, minimum: 0, maximum: 1 }
        lock_photo_az: { type: boolean, description: defaults to false when omitted }
        lock_photo_tilt: { type: boolean }
        lock_photo_roll: { type: boolean }
        lock_size_rad: { type: boolean }

    PhotoUpdate:
      type: object
      description: |
        Partial-update body for PUT /photos/{id}. Every field is
        optional; only keys present in the body are written.
      properties:
        aspect: { type: number, format: double }
        photo_az: { type: number, format: double }
        photo_tilt: { type: number, format: double }
        photo_roll: { type: number, format: double }
        size_rad: { type: number, format: double }
        opacity: { type: number, format: double, minimum: 0, maximum: 1 }
        lock_photo_az: { type: boolean }
        lock_photo_tilt: { type: boolean }
        lock_photo_roll: { type: boolean }
        lock_size_rad: { type: boolean }

    ImageMeasurementPatch:
      type: object
      description: |
        POST body for `POST /photos/{id}/image-measurements`. u/v
        required; control_point_id optional (null = unlinked).
      required: [u, v]
      properties:
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        control_point_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true

    ImageMeasurementUpdate:
      type: object
      description: |
        Partial-update body for PUT /image-measurements/{id}. Every
        field optional. `control_point_id: null` unlinks.
      properties:
        u: { type: number, format: double, minimum: 0, maximum: 1 }
        v: { type: number, format: double, minimum: 0, maximum: 1 }
        control_point_id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          nullable: true

    ControlPointPatch:
      type: object
      description: |
        Body for both `POST /control-points` and `PUT
        /control-points/{id}`. Every field optional. On POST, omitted
        fields take their column defaults; on PUT, omitted fields are
        preserved.
      properties:
        description: { type: string }
        notes: { type: string }
        est_lat: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        est_lng: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
        est_alt: { type: number, format: double, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        lock_est_lat: { type: boolean }
        lock_est_lng: { type: boolean }
        lock_est_alt: { type: boolean }

    SolveConfig:
      type: object
      description: |
        Optional knobs for the solver. Defaults are used when omitted.
      properties:
        max_iters: { type: integer, minimum: 1, maximum: 10000, description: GN iteration cap (synchronous default 30, streaming default 1000) }
        residual_tol_rad: { type: number, format: double, description: per-residual-RMS convergence threshold, default 1e-4 }
        rel_improve_tol: { type: number, format: double, description: per-iteration fractional reduction in residual RMS below which the run is considered converged (default 1e-4); push smaller for tighter convergence at the cost of more iterations }
        dry_run:
          type: boolean
          description: |
            When true, run the solver but skip the DB writeback. The response
            still carries iterations, residuals, auto_locked_columns, and the
            diff that would have been applied. Useful for diagnosis.

    EntityChange:
      type: object
      description: One row's before/after for the keys the solver actually moved.
      required: [kind, id, before, after]
      properties:
        kind:
          type: string
          enum: [station, photo, control_point]
        id: { $ref: '#/components/schemas/Id' }
        before:
          type: object
          additionalProperties: { type: number, format: double }
        after:
          type: object
          additionalProperties: { type: number, format: double }

    SolveResult:
      type: object
      required: [iterations, initial_residual_rms, final_residual_rms, converged, diverged, changes]
      properties:
        iterations: { type: integer }
        initial_residual_rms: { type: number, format: double }
        final_residual_rms: { type: number, format: double }
        converged: { type: boolean, description: residual or step tolerance reached }
        diverged: { type: boolean, description: solver could not improve the initial residual; no changes were applied }
        auto_locked_columns:
          type: array
          description: |
            Free parameters whose Jacobian column was effectively zero — usually
            an unobservable parameter (e.g. est_alt of a CP only seen by one
            station). The solver pinned them for this run.
          items: { type: string }
        changes:
          type: array
          items: { $ref: '#/components/schemas/EntityChange' }
