services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: panorama
      POSTGRES_PASSWORD: panorama
      POSTGRES_DB: panorama
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # api + solver are opt-in under the `app` profile so a plain
  # `docker compose up` still brings up just Postgres (the old behavior).
  # Bring up the full split with:  docker compose --profile app up --build
  # api is the only public service (browser talks to :8080). solver has no
  # host port mapping — it's only reachable from inside the docker network
  # via the SOLVER_URL passed to api.
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.api
    image: panorama-api:dev
    depends_on:
      - postgres
      - solver
    environment:
      DATABASE_URL: postgres://panorama:panorama@postgres:5432/panorama?sslmode=disable
      STATIC_DIR: /static
      STORAGE_DIR: /data
      SOLVER_URL: http://solver:8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ../frontend/dist:/static:ro

  solver:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.solver
    image: panorama-solver:dev
    # No `ports:` — solver is private; only api inside the docker network
    # reaches it on the service name `solver` at port 8080.

volumes:
  pgdata:
